name: Release

# Manual validation mode: no publication.
# GHCR container publication on release tags only.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      validation_only:
        description: "Run validation without publishing container or GitHub Release"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: UTC
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Release validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            TAG="v$(node -p "require('./package.json').version")"
            VERSION="${TAG#v}"
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "v${PKG_VERSION}" != "${TAG}" ]]; then
            echo "Tag/version mismatch: tag=${TAG} package=${PKG_VERSION}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Release check
        env:
          CITED_RELEASE_MODE: release
        run: npm run release:check
      - name: Determine publish mode
        id: publish
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.validation_only }}" == "true" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  artifacts:
    name: Release artifacts
    runs-on: ubuntu-latest
    needs: [validate]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run sbom:generate
      - run: npm run release:artifacts
        env:
          CITED_RELEASE_MODE: release
      - name: Upload release artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-artifacts-${{ needs.validate.outputs.version }}
          path: .cited/release/${{ needs.validate.outputs.version }}/
          retention-days: 14

  container:
    name: Container build and publish
    runs-on: ubuntu-latest
    needs: [validate, artifacts]
    if: needs.validate.outputs.publish == 'true'
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@f6efe56d565add159ad605568120f5b22712a870 # v5.6.1
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.version }}
            type=raw,value=latest
      - name: Build and push container image to GHCR
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
      - name: Scan published image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.validate.outputs.version }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, artifacts, container]
    if: needs.validate.outputs.publish == 'true'
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-artifacts-${{ needs.validate.outputs.version }}
          path: release-upload
      - name: Prepare release notes
        run: node scripts/extract-changelog-section.mjs "${{ needs.validate.outputs.version }}" > release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: Cited ${{ needs.validate.outputs.tag }}
          body_path: release-notes.md
          files: release-upload/*
          generate_release_notes: false
