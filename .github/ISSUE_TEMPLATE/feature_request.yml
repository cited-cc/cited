name: Feature request
description: Suggest an enhancement for the Cited open-source project
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests help shape the public core roadmap. Hosted-only Cited Cloud features may remain private.

  - type: textarea
    id: problem
    attributes:
      label: Problem being solved
      description: What pain point or use case motivates this request?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Cited do instead?
    validations:
      required: true

  - type: dropdown
    id: relevance
    attributes:
      label: Self-hosted or Cloud relevance
      options:
        - Self-hosted only
        - Cited Cloud only
        - Both
        - Unsure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, products, or workarounds you evaluated
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: Willingness to contribute
      options:
        - Yes, I can open a pull request
        - Yes, with guidance
        - No, suggestion only
    validations:
      required: true
